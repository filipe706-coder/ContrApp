# Sempre que fizeres push para o GitHub, isto compila a app e guarda o APK
# na página da execução (separador "Actions" -> última execução -> "Artifacts").
name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NifCaixa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
